services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bestagentmedia
      POSTGRES_USER: bestagentmedia
      POSTGRES_PASSWORD: bestagentmedia
    ports:
      - "5432:5432"
    volumes:
      - bestagentmedia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestagentmedia -d bestagentmedia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bestagentmedia-postgres:
